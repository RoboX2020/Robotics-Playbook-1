<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 847" width="280" height="847"><rect width="280" height="847" fill="white"/><g font-family="Arial,sans-serif" fill="#111"><text x="8" y="31" font-size="17">Chapter 2: circuit schematic</text><text x="8" y="55" font-size="15">Power OFF before wiring.</text><text x="8" y="79" font-size="14">Repeated node labels are joined.</text><rect x="3" y="97" width="274" height="170" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="123" font-size="17">IR module terminals</text><text x="12" y="150" font-size="14">Uno 5V</text><path d="M112,145 L148,145" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="145" r="3" fill="#171717"/><text x="158" y="150" font-size="14">VCC</text><text x="12" y="190" font-size="14">Uno GND</text><path d="M112,185 L148,185" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="185" r="3" fill="#171717"/><text x="158" y="190" font-size="14">GND</text><text x="12" y="230" font-size="14">Uno D2</text><path d="M112,225 L148,225" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="225" r="3" fill="#171717"/><text x="158" y="230" font-size="14">OUT</text><rect x="3" y="281" width="274" height="170" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="307" font-size="17">Servo</text><text x="12" y="334" font-size="14">Uno D9</text><path d="M112,329 L148,329" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="329" r="3" fill="#171717"/><text x="158" y="334" font-size="14">Signal</text><text x="12" y="374" font-size="14">External +</text><path d="M112,369 L148,369" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="369" r="3" fill="#171717"/><text x="158" y="374" font-size="14">V+</text><text x="12" y="414" font-size="14">External -</text><path d="M112,409 L148,409" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="409" r="3" fill="#171717"/><text x="158" y="414" font-size="14">GND</text><rect x="3" y="465" width="274" height="130" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="491" font-size="17">Power / common ground</text><text x="12" y="518" font-size="14">USB bank</text><path d="M112,513 L148,513" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="513" r="3" fill="#171717"/><text x="158" y="518" font-size="14">USB socket</text><text x="12" y="558" font-size="14">Controller GND</text><path d="M112,553 L148,553" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="553" r="3" fill="#171717"/><text x="158" y="558" font-size="14">Supply -</text><rect x="3" y="609" width="274" height="93" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="635" font-size="17">Power separation</text><text x="12" y="659" font-size="14">External + powers load ONLY</text><text x="12" y="683" font-size="14">Do not join it to controller 5V.</text><rect x="3" y="716" width="274" height="117" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="742" font-size="17">Before applying power</text><text x="12" y="767" font-size="14">Verify module pinout / ratings.</text><text x="12" y="792" font-size="14">USB powers the controller.</text><text x="12" y="817" font-size="13">Follow the chapter safety checks.</text></g></svg>
