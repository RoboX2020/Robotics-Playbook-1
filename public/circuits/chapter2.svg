<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 806" width="360" height="806"><rect width="360" height="806" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:12px;fill:#111}.head{font-size:18px;font-weight:bold}</style><text x="16" y="26" class="head">Chapter 2: wiring illustration</text><text x="16" y="50">Power OFF while wiring. Follow terminal labels.</text><text x="16" y="70">Lines are wires; repeated labels are one node.</text><rect x="10" y="98" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="98" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 120 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="120" r="3" fill="#111"/><circle cx="204" cy="120" r="3" fill="#111"/><text x="18" y="125">Uno 5V</text><text x="211" y="125">IR VCC</text><rect x="10" y="170" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="170" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 192 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="192" r="3" fill="#111"/><circle cx="204" cy="192" r="3" fill="#111"/><text x="18" y="197">Uno GND</text><text x="211" y="197">IR GND</text><rect x="10" y="242" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="242" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 264 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="264" r="3" fill="#111"/><circle cx="204" cy="264" r="3" fill="#111"/><text x="18" y="269">Uno D2</text><text x="211" y="269">IR OUT</text><rect x="10" y="314" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="314" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 336 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="336" r="3" fill="#111"/><circle cx="204" cy="336" r="3" fill="#111"/><text x="18" y="341">Uno D9</text><text x="211" y="341">Servo signal</text><rect x="10" y="386" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="386" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 408 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="408" r="3" fill="#111"/><circle cx="204" cy="408" r="3" fill="#111"/><text x="18" y="413">External 5V +</text><text x="211" y="413">Servo red (+)</text><rect x="10" y="458" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="458" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 480 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="480" r="3" fill="#111"/><circle cx="204" cy="480" r="3" fill="#111"/><text x="18" y="485">External 5V -</text><text x="211" y="485">Servo GND</text><rect x="10" y="530" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="530" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 552 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="552" r="3" fill="#111"/><circle cx="204" cy="552" r="3" fill="#111"/><text x="18" y="557">Uno GND</text><text x="211" y="557">External 5V -</text><rect x="10" y="602" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="602" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 624 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="624" r="3" fill="#111"/><circle cx="204" cy="624" r="3" fill="#111"/><text x="18" y="629">USB cable</text><text x="211" y="629">Uno USB</text><text x="10" y="701">Check module pinout and ratings before power.</text><text x="10" y="719">USB powers controller; motor/servo supply separate.</text><text x="10" y="737">All indicated GND / negative nodes join together.</text><text x="10" y="755">Never join external + to controller 5V in this lab.</text></svg>
