<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 927" width="280" height="927"><rect width="280" height="927" fill="white"/><g font-family="Arial,sans-serif" fill="#111"><text x="8" y="31" font-size="17">Chapter 5: circuit schematic</text><text x="8" y="55" font-size="15">Power OFF before wiring.</text><text x="8" y="79" font-size="14">Repeated node labels are joined.</text><rect x="3" y="97" width="274" height="210" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="123" font-size="17">Joystick terminals</text><text x="12" y="150" font-size="14">Uno 5V</text><path d="M112,145 L148,145" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="145" r="3" fill="#171717"/><text x="158" y="150" font-size="14">VCC</text><text x="12" y="190" font-size="14">Uno GND</text><path d="M112,185 L148,185" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="185" r="3" fill="#171717"/><text x="158" y="190" font-size="14">GND</text><text x="12" y="230" font-size="14">Uno A0</text><path d="M112,225 L148,225" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="225" r="3" fill="#171717"/><text x="158" y="230" font-size="14">VRx</text><text x="12" y="270" font-size="14">Uno A1</text><path d="M112,265 L148,265" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="265" r="3" fill="#171717"/><text x="158" y="270" font-size="14">VRy</text><rect x="3" y="321" width="274" height="210" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="347" font-size="17">Two positional servos</text><text x="12" y="374" font-size="14">Uno D9</text><path d="M112,369 L148,369" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="369" r="3" fill="#171717"/><text x="158" y="374" font-size="14">Pan signal</text><text x="12" y="414" font-size="14">Uno D10</text><path d="M112,409 L148,409" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="409" r="3" fill="#171717"/><text x="158" y="414" font-size="14">Tilt signal</text><text x="12" y="454" font-size="14">External +</text><path d="M112,449 L148,449" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="449" r="3" fill="#171717"/><text x="158" y="454" font-size="14">Both V+</text><text x="12" y="494" font-size="14">External -</text><path d="M112,489 L148,489" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="489" r="3" fill="#171717"/><text x="158" y="494" font-size="14">Both GND</text><rect x="3" y="545" width="274" height="130" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="571" font-size="17">Power / common ground</text><text x="12" y="598" font-size="14">USB bank</text><path d="M112,593 L148,593" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="593" r="3" fill="#171717"/><text x="158" y="598" font-size="14">USB socket</text><text x="12" y="638" font-size="14">Controller GND</text><path d="M112,633 L148,633" fill="none" stroke="#171717" stroke-width="2"/><circle cx="148" cy="633" r="3" fill="#171717"/><text x="158" y="638" font-size="14">Supply -</text><rect x="3" y="689" width="274" height="93" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="715" font-size="17">Power separation</text><text x="12" y="739" font-size="14">External + powers load ONLY</text><text x="12" y="763" font-size="14">Do not join it to controller 5V.</text><rect x="3" y="796" width="274" height="117" rx="8" fill="white" stroke="#111" stroke-width="2"/><text x="12" y="822" font-size="17">Before applying power</text><text x="12" y="847" font-size="14">Verify module pinout / ratings.</text><text x="12" y="872" font-size="14">USB powers the controller.</text><text x="12" y="897" font-size="13">Follow the chapter safety checks.</text></g></svg>
