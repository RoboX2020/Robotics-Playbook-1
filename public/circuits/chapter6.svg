<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 662" width="360" height="662"><rect width="360" height="662" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:12px;fill:#111}.head{font-size:18px;font-weight:bold}</style><text x="16" y="26" class="head">Chapter 6: wiring illustration</text><text x="16" y="50">Power OFF while wiring. Follow terminal labels.</text><text x="16" y="70">Lines are wires; repeated labels are one node.</text><rect x="10" y="98" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="98" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 120 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="120" r="3" fill="#111"/><circle cx="204" cy="120" r="3" fill="#111"/><text x="18" y="125">Uno D2</text><text x="211" y="125">Button terminal1</text><rect x="10" y="170" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="170" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 192 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="192" r="3" fill="#111"/><circle cx="204" cy="192" r="3" fill="#111"/><text x="18" y="197">Button terminal2</text><text x="211" y="197">Uno GND</text><rect x="10" y="242" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="242" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 264 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="264" r="3" fill="#111"/><circle cx="204" cy="264" r="3" fill="#111"/><text x="18" y="269">Uno D8</text><text x="211" y="269">330Ω resistor</text><rect x="10" y="314" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="314" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 336 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="336" r="3" fill="#111"/><circle cx="204" cy="336" r="3" fill="#111"/><text x="18" y="341">330Ω other end</text><text x="211" y="341">LED anode (+)</text><rect x="10" y="386" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="386" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 408 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="408" r="3" fill="#111"/><circle cx="204" cy="408" r="3" fill="#111"/><text x="18" y="413">LED cathode (-)</text><text x="211" y="413">Uno GND</text><rect x="10" y="458" width="146" height="44" rx="5" fill="#eef5ff" stroke="#111" stroke-width="2"/><rect x="204" y="458" width="146" height="44" rx="5" fill="#fff8df" stroke="#111" stroke-width="2"/><path d="M156 480 H204" stroke="#111" stroke-width="3"/><circle cx="156" cy="480" r="3" fill="#111"/><circle cx="204" cy="480" r="3" fill="#111"/><text x="18" y="485">USB cable</text><text x="211" y="485">Uno USB</text><text x="10" y="557">Use listed resistors and correct LED polarity.</text><text x="10" y="575">Verify breadboard node connections before power.</text><text x="10" y="593">No motors or external load power in this sketch.</text></svg>
